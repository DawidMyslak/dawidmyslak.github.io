    <script>
      // Typing effect
      const titles = [
        "Software Engineer",
        "Full Stack Developer",
        "Systems Architect",
        "AI Agent",
      ];
      let titleIndex = 0;
      let charIndex = 0;
      let isDeleting = false;
      const typedElement = document.getElementById("typed-title");

      function typeEffect() {
        const currentTitle = titles[titleIndex];

        if (isDeleting) {
          typedElement.textContent = currentTitle.substring(0, charIndex - 1);
          charIndex--;
        } else {
          typedElement.textContent = currentTitle.substring(0, charIndex + 1);
          charIndex++;
        }

        let typeSpeed = isDeleting ? 50 : 100;

        if (!isDeleting && charIndex === currentTitle.length) {
          typeSpeed = 2000;
          isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          titleIndex = (titleIndex + 1) % titles.length;
          typeSpeed = 500;
        }

        setTimeout(typeEffect, typeSpeed);
      }

      // Particle system
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let mouse = { x: null, y: null };

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.hue = Math.random() * 60 + 180; // Cyan to blue range
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          // Mouse interaction
          if (mouse.x && mouse.y) {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              const force = (150 - dist) / 150;
              this.x -= dx * force * 0.02;
              this.y -= dy * force * 0.02;
            }
          }

          if (
            this.x < 0 ||
            this.x > canvas.width ||
            this.y < 0 ||
            this.y > canvas.height
          ) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.opacity})`;
          ctx.fill();
        }
      }

      function isMobile() {
        return window.innerWidth <= 768 || "ontouchstart" in window;
      }

      function initParticles() {
        particles = [];
        // Reduce particles on mobile for better performance
        const baseCount = isMobile() ? 40 : 100;
        const divisor = isMobile() ? 25000 : 15000;
        const particleCount = Math.min(
          baseCount,
          Math.floor((canvas.width * canvas.height) / divisor),
        );
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      }

      function connectParticles() {
        const maxDist = isMobile() ? 80 : 120; // Shorter connections on mobile
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDist) {
              ctx.beginPath();
              ctx.strokeStyle = `hsla(200, 100%, 70%, ${0.1 * (1 - dist / maxDist)})`;
              ctx.lineWidth = 0.5;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p) => {
          p.update();
          p.draw();
        });

        connectParticles();
        requestAnimationFrame(animateParticles);
      }

      // 3D Card tilt effect
      const card = document.getElementById("card");

      function handleMouseMove(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 20;
        const rotateY = (centerX - x) / 20;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      }

      function handleMouseLeave() {
        card.style.transform =
          "perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)";
      }

      // Counter animation
      function animateCounters() {
        const counters = document.querySelectorAll(".stat-value[data-count]");
        counters.forEach((counter) => {
          const target = parseInt(counter.dataset.count);
          if (isNaN(target)) return; // Skip non-numeric values

          const duration = 2000;
          const start = performance.now();

          function updateCounter(currentTime) {
            const elapsed = currentTime - start;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            counter.textContent = Math.floor(target * easeOut);

            if (progress < 1) {
              requestAnimationFrame(updateCounter);
            } else {
              counter.textContent = target;
            }
          }

          requestAnimationFrame(updateCounter);
        });
      }

      // Initialize
      window.addEventListener("load", () => {
        resizeCanvas();
        initParticles();
        animateParticles();

        // Hide loader and show content
        setTimeout(() => {
          document.getElementById("loader").classList.add("hidden");
          document.getElementById("content").classList.add("visible");

          setTimeout(() => {
            typeEffect();
            animateCounters();
          }, 500);
        }, 2500);

        // Card tilt effect (desktop only - no touch devices)
        if (!isMobile()) {
          card.addEventListener("mousemove", handleMouseMove);
          card.addEventListener("mouseleave", handleMouseLeave);
        }
      });

      window.addEventListener("resize", () => {
        resizeCanvas();
        initParticles();
      });

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });
    </script>
